kind = "web"
previewPath = "/"
title = "QuickBook — Appointment Booking"
version = "1.0.0"
id = "artifacts/quickbook"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21933

[services.development]
run = "PORT=21933 BASE_PATH=/ pnpm --filter @workspace/quickbook run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quickbook", "run", "build" ]
publicDir = "artifacts/quickbook/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21933"
BASE_PATH = "/"
